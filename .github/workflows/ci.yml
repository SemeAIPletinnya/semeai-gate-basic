name: ci

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout canonical public benchmark authority
        uses: actions/checkout@v4
        with:
          repository: SemeAIPletinnya/semeai.tech
          ref: 2d9b5d548e9b10e994c5ff3b70db98bac1722d6c
          path: _authority/semeai.tech
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Python compile
        run: |
          python -m py_compile semeai_gate_basic\gate.py semeai_gate_basic\api.py semeai_gate_basic\server.py semeai_gate_basic\skill_registry.py semeai_gate_basic\skill_registry_http.py semeai_gate_basic\__main__.py tools\run_benchmark.py tools\check_contract.py examples\existing_chatbot_integration.py examples\middleware_boundary.py tests\test_gate_basic.py tests\test_skill_registry.py

      - name: Python tests
        env:
          SEMEAI_FRONTEND_ROOT: ${{ github.workspace }}/_authority/semeai.tech
        run: |
          python -m pytest

      - name: Benchmark
        run: |
          python tools\run_benchmark.py

      - name: Contract check
        run: |
          python tools\check_contract.py

      - name: Node example
        run: |
          node examples\fake_promo_code.js
          node examples\existing_chatbot_integration.js
          node examples\middleware_boundary.js
